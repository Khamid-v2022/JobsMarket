services:
  postgres:
    image: postgres:17
    container_name: talent_postgres
    environment:
      POSTGRES_DB: talent_marketplace
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: talent_redis
    ports:
      - "6379:6379"

  meilisearch:
    image: getmeili/meilisearch:v1.13
    container_name: talent_meilisearch
    environment:
      MEILI_MASTER_KEY: masterKey
    ports:
      - "7700:7700"

  mailpit:
    image: axllent/mailpit:latest
    container_name: talent_mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
